name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project & Fix SDK Version
        run: |
          cd flutter_app
          flutter create . --platforms=android --org com.chuecocam
          
          # Forzar compileSdk y minSdk para compatibilidad con mobile_scanner y WebRTC
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' $BUILD_GRADLE
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' $BUILD_GRADLE
            sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' $BUILD_GRADLE
          fi

          # Inyectar permisos en AndroidManifest.xml
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-feature android:name="android.hardware.camera" android:required="true"/>\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>'
          
          sed -i "s|<manifest.*>|<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    $PERMISSIONS|g" $MANIFEST_FILE

      - name: Build APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
