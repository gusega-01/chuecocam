name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Android Project
        run: |
          cd flutter_app
          flutter create . --platforms=android --org com.chuecocam

      - name: Update Gradle Android Config
        run: |
          cd flutter_app
          python3 -c "import glob, re; [open(f, 'w').write(re.sub(r'(compileSdk|targetSdk)\s*(=|\s)\s*\d+', r'\1 \2 34', re.sub(r'minSdk\s*(=|\s)\s*\d+', 'minSdk 21', open(f).read()))) for f in glob.glob('android/app/build.gradle*')]"

      - name: Update Android Permissions
        run: |
          cd flutter_app
          python3 -c "import re; f='android/app/src/main/AndroidManifest.xml'; c=open(f).read(); p='<uses-permission android:name=\"android.permission.INTERNET\"/><uses-permission android:name=\"android.permission.CAMERA\"/><uses-permission android:name=\"android.permission.RECORD_AUDIO\"/><uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/><uses-permission android:name=\"android.permission.WAKE_LOCK\"/><uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\"/>'; open(f,'w').write(re.sub(r'(<manifest[^>]*>)', r'\1'+p, c, count=1)) if 'android.permission.CAMERA' not in c else None"

      - name: Build APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
