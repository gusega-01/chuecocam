name: chuecocam
description: Baby Cam con WebRTC y Socket.IO

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.12.0
  socket_io_client: ^2.0.3+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  cupertino_icons: ^1.0.8
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
